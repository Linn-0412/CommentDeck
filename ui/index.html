<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CommentDeck</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><img src="icon.png" alt=""><span>CommentDeck</span></div>
    <div class="obs-url">
      <span class="obs-label">OBS のブラウザソースに貼る URL</span>
      <code id="overlay-url">…</code>
      <button id="copy-url" class="btn small">コピー</button>
    </div>
    <div class="chips">
      <span class="chip" id="chip-youtube"><i></i>YouTube</span>
      <span class="chip" id="chip-twitch"><i></i>Twitch</span>
      <span class="chip" id="chip-obs"><i></i>OBS</span>
    </div>
  </header>

  <div id="update-banner" class="banner hidden"></div>

  <main class="layout">
    <section class="panel settings">
      <nav class="tabs">
        <button data-tab="connect" class="active">接続</button>
        <button data-tab="style">見た目</button>
        <button data-tab="rules">ルール</button>
        <button data-tab="themes">テーマ</button>
        <button data-tab="app">アプリ</button>
      </nav>
      <div class="tab-body" id="tab-connect"></div>
      <div class="tab-body hidden" id="tab-style"></div>
      <div class="tab-body hidden" id="tab-rules"></div>
      <div class="tab-body hidden" id="tab-themes"></div>
      <div class="tab-body hidden" id="tab-app"></div>
      <div class="save-state" id="save-state">変更は自動で保存されます</div>
    </section>

    <section class="panel preview">
      <div class="preview-bar">
        <strong>プレビュー</strong>
        <span class="muted">OBS と同じ見た目です</span>
        <span class="spacer"></span>
        <select id="preview-bg" title="背景">
          <option value="checker">背景: 透明(市松)</option>
          <option value="game">背景: ゲーム画面風</option>
          <option value="dark">背景: 黒</option>
          <option value="light">背景: 白</option>
        </select>
      </div>
      <div class="preview-stage bg-checker" id="preview-stage">
        <div id="preview-deck"></div>
      </div>
      <div class="preview-actions">
        <button id="btn-test" class="btn primary">テストコメントを流す</button>
        <button id="btn-samples" class="btn">見本を表示</button>
        <button id="btn-clear" class="btn">クリア</button>
        <span class="muted small">テストコメントとクリアは OBS にも反映されます</span>
      </div>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
